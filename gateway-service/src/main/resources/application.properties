# Server Configuration
server.port=8080

# Application Name
spring.application.name=gateway-service

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8083/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Spring Cloud Gateway Routes with Load Balancing - DISABLED for compatibility with servlet-based dynamic routing
# User Service Route
# spring.cloud.gateway.routes[0].id=user-service
# spring.cloud.gateway.routes[0].uri=lb://user-service
# spring.cloud.gateway.routes[0].predicates[0]=Path=/user/**

# Product Service Route  
# spring.cloud.gateway.routes[1].id=product-service
# spring.cloud.gateway.routes[1].uri=lb://product-service
# spring.cloud.gateway.routes[1].predicates[0]=Path=/product/**

# Basic HTTP Client Configuration
# spring.cloud.gateway.httpclient.connect-timeout=5000
# spring.cloud.gateway.httpclient.response-timeout=10s

# Feign Client Configuration
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000
feign.client.config.default.logger-level=basic

# Load Balancer Configuration
spring.cloud.loadbalancer.ribbon.enabled=false

# Dynamic Routing Configuration
gateway.dynamic-routing.enabled=true
gateway.dynamic-routing.timeout.connect=5000
gateway.dynamic-routing.timeout.read=10000
gateway.dynamic-routing.retry.max-attempts=3
gateway.dynamic-routing.retry.delay=1000

# Logging Configuration
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.example.gateway=INFO
logging.level.com.example.gateway.controller.DynamicProxyController=INFO
logging.level.com.example.gateway.service=INFO

# Logging Pattern for better readability
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] %logger{36} - %msg%n

# Actuator Configuration for Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
